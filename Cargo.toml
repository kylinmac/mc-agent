[workspace]
members = ["crates/host-core", "crates/mc-computer"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "LGPL-3.0-or-later"
version = "0.21.0"

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
panic = "abort"
strip = true
lto = "thin"
codegen-units = 1
