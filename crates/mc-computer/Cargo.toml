[package]
name = "mc-computer"
description = "mc-agent Computer Use helper: a local MCP server that sees and operates desktop apps (docs/mc-agent/computer-use.md)"
edition.workspace = true
license.workspace = true
version = "0.1.0"
publish = false

[[bin]]
name = "mc-computer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
libc = "0.2"
