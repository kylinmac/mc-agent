[package]
name = "mc-computer"
description = "mc-agent Computer Use helper: a local MCP server that sees and operates desktop apps (docs/mc-agent/computer-use.md)"
edition.workspace = true
license.workspace = true
version = "0.2.0"
publish = false

[[bin]]
name = "mc-computer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Threading",
  "Win32_System_StationsAndDesktops", "Win32_Security",
  "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
] }
