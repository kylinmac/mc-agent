[package]
name = "mc-mobile-gateway"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Thin iroh P2P/Relay mobile gateway sidecar for mc-agent desktop (R43)"
publish = false

[[bin]]
name = "mc-mobile-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
iroh = "1.2"
iroh-mdns-address-lookup = "0.5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
url = "2"

[dev-dependencies]
tempfile = "3"
