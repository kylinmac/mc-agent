name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      # Release-note entries only; docs-check.yml validates their format.
      - 'packages/shared/src/mc-changelog*.ts'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      # Release-note entries only; docs-check.yml validates their format.
      - 'packages/shared/src/mc-changelog*.ts'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS build / typecheck / lint / architecture / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Match the Node that Electron 43 bundles (24.18), so CI type-checks
          # and tests against the same runtime the app actually ships.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # The docs site is built by docs-check.yml; the desktop bundle is not
        # needed here (Typecheck Desktop runs tsc).
        run: pnpm -r --filter '!@pi-desktop/docs' --filter '!@pi-desktop/desktop' --if-present build

      - name: Typecheck Desktop
        # Workspace dependency builds already run tsc; Vite does not check the app.
        run: pnpm --filter @pi-desktop/desktop typecheck

      - name: Lint
        run: pnpm lint

      - name: Check architecture budgets
        env:
          ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node scripts/check-architecture.mjs

      - name: Unit-test the Pi patch checks
        run: node --test scripts/pi-patch-hash.test.mjs

      # apps/desktop's node --test suite runs in the sharded desktop-tests job.
      - name: Unit tests (workspace packages)
        run: pnpm -r --filter '!@pi-desktop/desktop' --if-present test

  desktop-tests:
    name: Desktop unit tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # The docs site is built by docs-check.yml.
        run: pnpm -r --filter '!@pi-desktop/docs' --if-present build

      - name: Unit tests (apps/desktop)
        working-directory: apps/desktop
        run: node --test --test-shard=${{ matrix.shard }}/3 test/*.test.mjs

  rust:
    name: Rust host-core format / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test -p host-core --locked

  rust-windows:
    name: Rust host-core Windows / transcript cache E2E
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        # No Electron runs here: skip install scripts, which spend ~2 minutes
        # rebuilding node-pty for Electron on Windows.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p host-core --all-targets --locked

      - name: Test transcript module on Windows
        run: "cargo test -p host-core --locked transcripts::"

      - name: Test native plugin executable registration on Windows
        run: |
          cargo test -p host-core --locked plugins::manifest::tests
          cargo test -p host-core --locked stdio_mcp_commands_may_not_escape_the_plugin
      - name: Test visualization paths and lifecycle on Windows
        run: cargo test -p host-core --locked visualization

      - name: Build host-core
        run: cargo build -p host-core --locked

      - name: Build Host RPC helper dependency
        run: pnpm --filter @pi-desktop/shared build

      - name: Test GenUI document file boundaries on Windows
        run: node --test apps/desktop/test/gen-ui-file-safety.test.mjs

      - name: Run transcript cache Host RPC E2E
        run: node scripts/e2e-transcript-cache.mjs

  trusted-extensions-e2e:
    name: Trusted extensions Electron E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `apt-get update` alone has taken 9-10 minutes on hosted runners. Try the
      # image's package lists first, refresh only if that fails, and run it in
      # the background so it overlaps the install and build steps below.
      - name: Start virtual display install
        run: |
          (
            set +e
            pkgs="openbox xauth xvfb"
            sudo apt-get install --no-install-recommends --yes $pkgs \
              || { sudo apt-get update && sudo apt-get install --no-install-recommends --yes $pkgs; }
            echo $? > "$RUNNER_TEMP/apt-display.status"
          ) > "$RUNNER_TEMP/apt-display.log" 2>&1 &

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: pnpm --filter @pi-desktop/desktop exec install-electron

      - name: Configure Chromium SUID sandbox
        run: |
          sandbox=apps/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      - name: Build workspace packages
        # The docs site is built by docs-check.yml.
        run: pnpm -r --filter '!@pi-desktop/docs' --if-present build

      - name: Build host-core
        run: cargo build -p host-core --locked

      - name: Wait for virtual display install
        timeout-minutes: 15
        run: |
          while [ ! -f "$RUNNER_TEMP/apt-display.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/apt-display.log"
          exit "$(cat "$RUNNER_TEMP/apt-display.status")"

      - name: Run inline GenUI interaction and isolation E2E
        run: xvfb-run --auto-servernum pnpm test:e2e:gen-ui

      - name: Run provider optional client certificate E2E
        # Electron occasionally stalls before the first request on hosted runners
        # (killed after 65s); retry once so a runner hiccup does not fail CI.
        run: |
          xvfb-run --auto-servernum pnpm test:e2e:provider-client-certificate || {
            echo "::warning::provider client certificate E2E failed once; retrying"
            xvfb-run --auto-servernum pnpm test:e2e:provider-client-certificate
          }

      - name: Run browser capture/resize E2E
        run: xvfb-run --auto-servernum sh -c 'openbox >/dev/null 2>&1 & exec node scripts/e2e-browser-capture-resize.mjs'

      - name: Run transcript rendering and disclosure E2E
        run: xvfb-run --auto-servernum sh -c 'node scripts/e2e-transcript-render.mjs && node scripts/e2e-transcript-disclosure-anchor.mjs && node --test apps/desktop/test/subagent-roster-user-path.test.mjs'

      - name: Run trusted extensions E2E
        env:
          DEBUG_E2E: "1"
        run: xvfb-run --auto-servernum pnpm test:e2e:trusted-extensions
      - name: Run File Manager theme E2E
        run: xvfb-run --auto-servernum pnpm test:e2e:file-manager-theme
