name: Carry unchanged macOS release assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Copy verified original macOS assets into the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kylinmac/mc-agent
        run: |
          set -euo pipefail
          test "$(gh release view v1.0.11 --json isDraft --jq .isDraft)" = true
          mkdir assets
          gh release view v1.0.10 --json assets > manifest.json
          gh release download v1.0.10 --dir assets --pattern 'latest-mac.yml' --pattern '*arm64*'
          python3 - <<'PY'
          import hashlib, json, pathlib
          manifest = json.loads(pathlib.Path('manifest.json').read_text())['assets']
          paths = list(pathlib.Path('assets').iterdir())
          assert len(paths) == 5, paths
          for path in paths:
              expected = next(a for a in manifest if a['name'] == path.name)
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              assert path.stat().st_size == expected['size'], path.name
              assert digest == expected['digest'], path.name
              print(path.name, digest)
          PY
          gh release upload v1.0.11 assets/*
