# mc-agent: build the Windows x64 packages of a release and attach them to it.
#
# The macOS build is made locally by scripts/mc-release.mjs, which creates the
# tag and the GitHub Release. This workflow is started by hand afterwards
# (Actions → "mc-agent Windows" → Run workflow, or
# `gh workflow run mc-windows.yml -f version=1.0.4`), builds on a native
# Windows runner from that tag, and uploads the installer, the portable exe,
# the zip and the updater feed (latest.yml) to the same release.
#
# Computer Use has no Windows backend: its plugin is bundled but stays off.
# Builds are unsigned, so Windows SmartScreen warns on first launch.

name: mc-agent Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v, e.g. 1.0.4 (the tag v<version> must exist)'
        required: true
        type: string
      ref:
        description: 'Build this branch or commit instead of the tag (for a test build; leave upload off)'
        required: false
        default: ''
        type: string
      upload:
        description: 'Attach the packages to the release (off: build only, keep them as a workflow artifact)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mc-windows-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.0.4, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || format('v{0}', inputs.version) }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build host-core and workspace packages
        run: |
          set -euo pipefail
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT
          pnpm install --frozen-lockfile
          pnpm --filter '@pi-desktop/desktop^...' --fail-if-no-match build
          wait "$host_build_pid"
          trap - EXIT

      - name: Build and test Windows Computer Use helper
        run: |
          node scripts/build-mc-computer.mjs --release
          cargo test -p mc-computer --locked

      - name: Bundle the runtime and the app
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          pnpm run bundle:runtime
          pnpm exec electron-vite build

      - name: Package (installer, zip, portable)
        working-directory: apps/desktop
        # Same packaging as upstream's dist:win, named mc-agent and stamped
        # with the release version; notify-only like the macOS build.
        run: |
          set -euo pipefail
          node ../../scripts/build-desktop-release.mjs win --x64 \
            "-c.extraMetadata.version=$VERSION" \
            -c.extraMetadata.mcUpdateDelivery=notify \
            -c.win.executableName=mc-agent \
            '-c.win.artifactName=mc-agent-Portable-${version}.${ext}' \
            '-c.portable.artifactName=mc-agent-Portable-${version}.${ext}' \
            '-c.nsis.artifactName=mc-agent-Setup-${version}.${ext}' \
            -c.nsis.shortcutName=mc-agent

      - name: Verify the packages
        working-directory: apps/desktop/release
        run: |
          set -euo pipefail
          ls -la
          for file in "mc-agent-Setup-$VERSION.exe" "mc-agent-Setup-$VERSION.exe.blockmap" \
                      "mc-agent-Portable-$VERSION.exe" "mc-agent-Portable-$VERSION.zip" latest.yml; do
            [[ -f "$file" ]] || { echo "::error::missing $file"; exit 1; }
          done
          grep -q "^version: $VERSION$" latest.yml || { echo "::error::latest.yml is not at $VERSION"; exit 1; }
          [[ -f win-unpacked/mc-agent.exe ]] || { echo "::error::win-unpacked/mc-agent.exe missing"; exit 1; }
          [[ -f win-unpacked/resources/bin/pi-desktop-host-core.exe ]] || { echo "::error::host-core missing"; exit 1; }
          [[ -f win-unpacked/resources/plugins/mc.computer-use/bin/mc-computer.exe ]] || { echo "::error::Computer Use helper missing"; exit 1; }
          win-unpacked/resources/plugins/mc.computer-use/bin/mc-computer.exe --version
          node -e '
            const asar = require("module").createRequire(require("path").resolve("../package.json"))("@electron/asar");
            const pkg = JSON.parse(asar.extractFile("win-unpacked/resources/app.asar", "package.json").toString());
            if (pkg.version !== process.env.VERSION) throw new Error("app reports " + pkg.version);
            if (pkg.mcUpdateDelivery !== "notify") throw new Error("app is not notify-only");
            console.log("app.asar at", pkg.version, "notify-only");
          '

      - name: Keep the packages as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mc-agent-windows-x64-${{ inputs.version }}
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.zip
            apps/desktop/release/latest.yml

  upload:
    name: Attach to release v${{ inputs.version }}
    needs: build
    if: inputs.upload && inputs.ref == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mc-agent-windows-x64-${{ inputs.version }}
          path: dist

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release upload "v${{ inputs.version }}" dist/* --repo "${{ github.repository }}" --clobber
